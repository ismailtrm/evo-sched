apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-smoke-toleration
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: scheduler-smoke-toleration
  template:
    metadata:
      labels:
        app: scheduler-smoke-toleration
    spec:
      schedulerName: evok8s-scheduler
      tolerations:
        - key: dedicated
          operator: Equal
          value: test
          effect: NoSchedule
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
